<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nori 紙娃娃 V2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="stage-panel" aria-label="紙娃娃預覽">
      <div class="stage-toolbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>Nori 紙娃娃 V2</h1>
            <p id="statusText">載入資料中...</p>
          </div>
        </div>
        <label class="stage-background-control">
          <span>背景</span>
          <select id="backgroundSelect" aria-label="背景"></select>
        </label>
        <div class="toolbar-controls">
          <button class="icon-button" id="playButton" type="button" title="播放動畫" aria-label="播放動畫">&gt;</button>
          <button class="icon-button" id="fitButton" type="button" title="重新置中" aria-label="重新置中">◎</button>
          <button class="icon-button toolbar-text-button" id="shareButton" type="button" title="複製分享連結" aria-label="複製分享連結">連結 (Link)</button>
          <button class="icon-button toolbar-text-button" id="saveImageButton" type="button" title="儲存 PNG" aria-label="儲存 PNG">儲存 (Save)</button>
          <button class="icon-button toolbar-text-button" id="clearButton" type="button" title="清空穿戴" aria-label="清空穿戴">清除 (Clear)</button>
        </div>
      </div>

      <div class="preview-wrap" id="previewWrap">
        <div class="effect-layer effect-layer-behind" id="effectLayerBehind" aria-hidden="true"></div>
        <canvas id="paperCanvas" width="180" height="180" aria-label="紙娃娃畫布"></canvas>
        <div class="effect-layer effect-layer-front" id="effectLayerFront" aria-hidden="true"></div>
      </div>

      <div class="worn-panel" aria-label="目前穿戴">
        <div class="worn-row" data-worn-slot="headgear-0">
          <span>服飾 1</span>
          <button type="button" data-clear-slot="headgear-0">無</button>
        </div>
        <div class="worn-row" data-worn-slot="headgear-1">
          <span>服飾 2</span>
          <button type="button" data-clear-slot="headgear-1">無</button>
        </div>
        <div class="worn-row" data-worn-slot="headgear-2">
          <span>服飾 3</span>
          <button type="button" data-clear-slot="headgear-2">無</button>
        </div>
        <div class="worn-row" data-worn-slot="cape">
          <span>肩飾</span>
          <button type="button" data-clear-slot="cape">無</button>
        </div>
      </div>
    </section>

    <aside class="control-panel" aria-label="紙娃娃控制">
      <div class="control-group">
        <label>種族 (Race)</label>
        <div class="segmented race-segmented" role="group" aria-label="角色種族">
          <button type="button" data-race="human" class="active">人類 (Human)</button>
          <button type="button" data-race="doram">喵族 (Doram)</button>
        </div>
      </div>

      <div class="control-group">
        <label>性別</label>
        <div class="segmented" role="group" aria-label="角色性別">
          <button type="button" data-sex="female" class="active">女性</button>
          <button type="button" data-sex="male">男性</button>
        </div>
      </div>

      <div class="control-group">
        <label>職業外觀</label>
        <select id="jobSelect" aria-label="職業外觀"></select>
      </div>

      <div class="control-group is-hidden">
        <label>ACT</label>
        <select id="actionSelect" aria-label="動作"></select>
      </div>

      <div class="control-group">
        <label>其他</label>
        <div class="job-mode-controls" role="group" aria-label="其他">
          <select id="mountSelect" class="is-hidden" aria-hidden="true" tabindex="-1">
            <option value="none">無 (None)</option>
          </select>
          <div class="button-strip mount-button-strip" id="mountButtons" role="group" aria-label="坐騎">
            <button type="button" data-mount-category="general" title="General Mount">一般坐騎</button>
            <button type="button" data-mount-category="job" title="Job Mount">職業坐騎</button>
          </div>
          <div class="button-strip">
          <button type="button" data-mode-toggle="secondCostume">第二服裝 (Second Costume)</button>
          </div>
        </div>
      </div>

      <div class="control-group">
        <label>服染</label>
        <select id="bodyColorSelect" aria-label="服染">
          <option>標準</option>
        </select>
      </div>

      <div class="control-group">
        <label>髮型</label>
        <select id="hairSelect" aria-label="髮型"></select>
      </div>

      <div class="control-group">
        <label>髮色</label>
        <select id="hairColorSelect" aria-label="髮色">
          <option>標準</option>
        </select>
      </div>

      <div class="control-group">
        <label>服飾</label>
        <div class="equipment-quick-filters" role="group" aria-label="服飾快捷篩選">
          <button type="button" data-equipment-filter="all" class="active" title="全部 (All)">全部</button>
          <button type="button" data-equipment-filter="motion" title="動態 (Motion)">動態</button>
          <button type="button" data-equipment-filter="effect" title="特效 (Effect)">特效</button>
          <button type="button" data-equipment-filter="top" title="上段 (Upper)">上段</button>
          <button type="button" data-equipment-filter="mid" title="中段 (Middle)">中段</button>
          <button type="button" data-equipment-filter="low" title="下段 (Lower)">下段</button>
          <button type="button" data-equipment-filter="cape" title="披肩 (Garment)">披肩</button>
        </div>
        <input id="headgearFilter" class="filter-input" type="search" placeholder="篩選 ID 或名稱" aria-label="篩選服飾" />
        <select id="headgearSelect1" aria-label="服飾 1"></select>
        <select id="headgearSelect2" aria-label="服飾 2"></select>
        <select id="headgearSelect3" aria-label="服飾 3"></select>
      </div>

      <div class="control-group">
        <label>肩飾</label>
        <input id="capeFilter" class="filter-input" type="search" placeholder="篩選 ID 或名稱" aria-label="篩選披風" />
        <select id="capeSelect" aria-label="披風"></select>
      </div>

      <section class="item-browser is-hidden" aria-label="服飾庫">
        <div class="item-browser-head">
          <label>服飾庫</label>
          <div class="button-strip" role="group" aria-label="服飾庫分類">
            <button type="button" data-browser-kind="headgear" class="active">服飾</button>
            <button type="button" data-browser-kind="cape">肩飾</button>
          </div>
        </div>
        <input id="itemSearch" class="filter-input" type="search" placeholder="搜尋 ID / 名稱 / const" aria-label="搜尋服飾庫" />
        <div id="itemResults" class="item-results" aria-live="polite"></div>
      </section>

      <div class="control-group">
        <label>狀態</label>
        <div class="button-strip" role="group" aria-label="狀態">
          <button type="button" data-pose="stand" class="active">立</button>
          <button type="button" data-pose="sit">坐</button>
          <button type="button" data-pose="walk">走</button>
          <button type="button" data-pose="pick">拾</button>
          <button type="button" data-pose="wait">待</button>
        </div>
      </div>

      <div class="control-group">
        <label>身體方向</label>
        <div class="direction-grid" role="group" aria-label="身體方向">
          <button type="button" data-action="0" class="active" title="下" aria-label="下">&darr;</button>
          <button type="button" data-action="1" title="左下" aria-label="左下">&swarr;</button>
          <button type="button" data-action="2" title="左" aria-label="左">&larr;</button>
          <button type="button" data-action="3" title="左上" aria-label="左上">&nwarr;</button>
          <button type="button" data-action="4" title="上" aria-label="上">&uarr;</button>
          <button type="button" data-action="5" title="右上" aria-label="右上">&nearr;</button>
          <button type="button" data-action="6" title="右" aria-label="右">&rarr;</button>
          <button type="button" data-action="7" title="右下" aria-label="右下">&searr;</button>
        </div>
      </div>

      <div class="control-group">
        <label>臉方向</label>
        <div class="button-strip" role="group" aria-label="臉方向">
          <button type="button" data-face="left">左</button>
          <button type="button" data-face="center" class="active">中央</button>
          <button type="button" data-face="right">右</button>
        </div>
      </div>

      <div class="control-group">
        <label>動畫</label>
        <div class="button-strip" role="group" aria-label="動畫">
          <button type="button" id="playButtonInline">自動</button>
        </div>
      </div>

      <div class="control-group">
        <label>顯示大小</label>
        <div class="button-strip" role="group" aria-label="顯示大小">
          <button type="button" data-display-size="compact">縮小</button>
          <button type="button" data-display-size="normal" class="active">標準</button>
          <button type="button" data-display-size="large">放大</button>
        </div>
      </div>

      <div class="control-group">
        <label>幀數</label>
        <input id="frameSlider" type="range" min="0" max="0" value="0" />
      </div>

      <div class="readout">
        <div>
          <span>圖層順序</span>
          <strong id="stackReadout">-</strong>
        </div>
        <div>
          <span>錨點</span>
          <strong id="anchorReadout">-</strong>
        </div>
        <div>
          <span>目前幀</span>
          <strong id="frameReadout">-</strong>
        </div>
      </div>
    </aside>
  </main>

  <script src="vendor/pako_inflate.min.js?v=2.1.0"></script>
  <script src="app.js?v=20260716-paperdoll-v2-doram-capes-1"></script>
</body>
</html>
